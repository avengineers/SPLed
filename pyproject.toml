[project]
name = "spled"
version = "0.0.1"
description = "SPL demo project"
authors = [{ name = "Avengineers" }]
requires-python = "<3.12,>=3.11"

dependencies = [
    "spl-core @ git+https://github.com/avengineers/spl-core.git@47ec8210790baf0dc361eb83bb98259d425e562b",
    "pypeline-runner>=1.33,<2",
    "pytest>=8,<9",
    "myst-parser>=4.0,<5",
    "pypeline-semantic-release>=0,<1",
    "poks>=0.9.4,<1",
    "object-deps-report>=0,<1",
    "clanguru>=0,<1",
]

[tool.poetry]
package-mode = false

[tool.ruff]
line-length = 180
