# The environment: virtual environment, toolchain and the env setup script.
#
#   pypeline run --config-file pipeline/bootstrap.yaml
#
# Included by variant_build.yaml, so every build, a test build too, sets it up the same way.
pipeline:
  - step: CreateVEnv
    module: pypeline.steps.create_venv
    config:
      bootstrap_script: .bootstrap/bootstrap.py
      python_version: "3.11"
      python_package_manager: poetry>=2.2
  - step: PoksInstall
    module: pypeline.steps.poks_install
  - step: ScoopInstall
    module: pypeline.steps.scoop_install
  - step: GenerateEnvSetupScript
    module: pypeline.steps.env_setup_script
