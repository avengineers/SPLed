name: CI

on:
    push:
        branches: [develop, "release/*"]
    pull_request:
        branches: [develop, "release/*"]
    schedule:
        - cron: "0 0 * * *"

    workflow_dispatch:

jobs:
    determine-gate:
        name: Determine Quality Gate
        runs-on: ubuntu-24.04
        outputs:
            marker: ${{ steps.gate.outputs.marker }}
        steps:
            - name: Determine Quality Gate
              id: gate
              shell: bash
              run: |
                  if [ "${{ github.event_name }}" = "schedule" ]; then
                      marker="gate_develop_nightly"
                  elif [ "${{ github.event_name }}" = "pull_request" ]; then
                      if [[ "${{ github.base_ref }}" == release/* ]]; then
                          marker="gate_release_pr"
                      else
                          marker="gate_develop_pr"
                      fi
                  elif [ "${{ github.event_name }}" = "push" ]; then
                      if [[ "${{ github.ref }}" == refs/heads/release/* ]]; then
                          marker="gate_release"
                      else
                          marker="gate_develop_push"
                      fi
                  else
                      marker="gate_develop_push"
                  fi
                  echo "Selected gate marker: $marker"
                  echo "marker=$marker" >> "$GITHUB_OUTPUT"

    discover:
        name: Discover Variants
        runs-on: ubuntu-24.04
        outputs:
            variants: ${{ steps.list.outputs.variants }}
        steps:
            - name: Checkout Code
              uses: actions/checkout@v6

            # The variant list comes from the project, so each job below builds one variant.
            - name: List Variants
              id: list
              run: echo "variants=$(python3 pipeline/variants.py)" >> "$GITHUB_OUTPUT"

    test-on-windows:
        name: Build and Test on Windows (${{ matrix.variant }})
        runs-on: windows-2025
        timeout-minutes: 30
        needs: [determine-gate, discover]
        strategy:
            fail-fast: false
            matrix:
                variant: ${{ fromJSON(needs.discover.outputs.variants) }}

        steps:
            - name: Checkout Code
              uses: actions/checkout@v6
              with:
                  fetch-depth: 0

            # Test classes spell IDEA/Sloemada as Test_IDEA__Sloemada, and artifact names cannot contain a slash.
            - name: Name the Variant
              id: names
              shell: bash
              run: echo "variant=${VARIANT//\//__}" >> "$GITHUB_OUTPUT"
              env:
                  VARIANT: ${{ matrix.variant }}

            - name: Installation of Dependencies and Execute Tests
              env:
                  # Workaround to force usage of scoop apps installed in $env:USERPROFILE
                  USER_PATH_FIRST: 1
              run: |
                  .\build.ps1 -install
                  .\.venv\Scripts\pytest -k "${{ steps.names.outputs.variant }}" -m "${{ needs.determine-gate.outputs.marker }}"
              shell: powershell

            - name: Deploy Test Results
              if: always()
              uses: mikepenz/action-junit-report@v6
              with:
                  report_paths: |
                      test/output/test-report.xml
                      build/**/variant-junit.xml
                  detailed_summary: true
                  include_passed: true
                  fail_on_failure: true
                  fail_on_parse_error: true
                  require_tests: true
                  check_name: "Test Results (Windows, ${{ matrix.variant }})"

            - name: Deploy Artifacts
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: artifacts_windows_${{ steps.names.outputs.variant }}
                  retention-days: 90
                  path: |
                      build/**/*.7z
                      build/**/pr_changes.json
                  if-no-files-found: error

    test-on-linux:
        name: Build and Test on Linux (${{ matrix.variant }})
        runs-on: ubuntu-24.04
        timeout-minutes: 30
        needs: [determine-gate, discover]
        strategy:
            fail-fast: false
            matrix:
                variant: ${{ fromJSON(needs.discover.outputs.variants) }}

        steps:
            - name: Checkout Code
              uses: actions/checkout@v6
              with:
                  fetch-depth: 0

            # Test classes spell IDEA/Sloemada as Test_IDEA__Sloemada, and artifact names cannot contain a slash.
            - name: Name the Variant
              id: names
              shell: bash
              run: echo "variant=${VARIANT//\//__}" >> "$GITHUB_OUTPUT"
              env:
                  VARIANT: ${{ matrix.variant }}

            - name: Provision via bootstrap scripts
              run: |
                  sudo ./bootstrap_ubuntu.sh
                  ./bootstrap_python.sh
                  echo "$HOME/.local/bin" >> "$GITHUB_PATH"

            - name: Installation of Dependencies and Execute Tests
              run: |
                  ./build.sh --install
                  .venv/bin/pytest -k "${{ steps.names.outputs.variant }}" -m "${{ needs.determine-gate.outputs.marker }}"

            - name: Deploy Test Results
              if: always()
              uses: mikepenz/action-junit-report@v6
              with:
                  report_paths: |
                      test/output/test-report.xml
                      build/**/variant-junit.xml
                  detailed_summary: true
                  include_passed: true
                  fail_on_failure: true
                  fail_on_parse_error: true
                  require_tests: true
                  check_name: "Test Results (Linux, ${{ matrix.variant }})"

            - name: Deploy Artifacts
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: artifacts_linux_${{ steps.names.outputs.variant }}
                  retention-days: 90
                  path: |
                      build/**/*.7z
                      build/**/pr_changes.json
                  if-no-files-found: error

    test-devcontainer:
        name: Build and Test in DevContainer (${{ matrix.variant }})
        runs-on: ubuntu-24.04
        timeout-minutes: 30
        needs: [determine-gate, discover]
        strategy:
            fail-fast: false
            matrix:
                variant: ${{ fromJSON(needs.discover.outputs.variants) }}

        steps:
            - name: Checkout Code
              uses: actions/checkout@v6
              with:
                  fetch-depth: 0

            # Test classes spell IDEA/Sloemada as Test_IDEA__Sloemada, and artifact names cannot contain a slash.
            - name: Name the Variant
              id: names
              shell: bash
              run: echo "variant=${VARIANT//\//__}" >> "$GITHUB_OUTPUT"
              env:
                  VARIANT: ${{ matrix.variant }}

            - name: Installation of Dependencies and Execute Tests
              uses: devcontainers/ci@v0.3
              with:
                  push: never
                  runCmd: |
                      .venv/bin/pytest -k "${{ steps.names.outputs.variant }}" -m "${{ needs.determine-gate.outputs.marker }}"

            - name: Deploy Test Results
              if: always()
              uses: mikepenz/action-junit-report@v6
              with:
                  report_paths: |
                      test/output/test-report.xml
                      build/**/variant-junit.xml
                  detailed_summary: true
                  include_passed: true
                  fail_on_failure: true
                  fail_on_parse_error: true
                  require_tests: true
                  check_name: "Test Results (DevContainer, ${{ matrix.variant }})"

            - name: Deploy Artifacts
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: artifacts_devcon_${{ steps.names.outputs.variant }}
                  retention-days: 90
                  path: |
                      build/**/*.7z
                      build/**/pr_changes.json
                  if-no-files-found: error
